# Configuración del editor (Sveltia CMS). Los campos de cada página corresponden a las
# marcas {{...}} de src/plantillas/<página>.html.
backend:
  name: github
  repo: gofio-design/clinicadentaldharma-static
  branch: main
site_url: https://gofio-design.github.io/clinicadentaldharma-static/
app_title: Clínica Dental Dharma
media_folder: public/wp-content/uploads
public_folder: /wp-content/uploads
collections:
