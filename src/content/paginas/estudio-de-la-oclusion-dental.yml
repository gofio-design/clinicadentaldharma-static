      ## Estudio de la oclusión dental
  texto_2:
    texto: |
      Realizamos un estudio postural para asegurar un buen encaje entre los dientes superiores e inferiores, así como una buena posición postural.

      Está comprobado que las maloculsiones dentales tienen una repercusión directa en muchos de los problemas posturales. Cada vez más estudios profundizan en la conexión de las articulaciones temporo mandibulares (ATMs), las articulaciones encargadas de abrir y cerrar la boca, con la posición corporal. En Dharma realizamos un estudio ocluso-postural completo, por un equipo multidisciplinar compuesto por odontólogos, fisioterapeutas y osteópatas de nuestra clínica.
  texto_3:
    texto: |
      #### **Funcionalidad y estética**

      Este estudio incluye un análisis completo estético y funcional de los maxilares y la posición de los dientes, mediante fotos y radiografías, que nos aportan una información detallada y completa sobre la oclusión y las características faciales y corporales del paciente, analizando, también, los movimientos masticatorios y la estética de la sonrisa.

      Así mismo se realiza una exploración física para llevar a cabo un análisis postural y un análisis de extensibilidad para conseguir  información  sobre la postura y  el funcionamiento muscular del paciente. También se realiza una breve evaluación de las funciones de respiración y deglución.

      Nuestros especialistas reúnen los resultados y realizan un análisis completo, buscando posibles relaciones entre la oclusión y las características funcionales y posturales del paciente.

      Ofrecemos un diagnóstico integral y completo para poder realizar los tratamientos adecuados, siempre con un trabajo conjunto entre especialidades, con el objetivo de obtener como resultado la salud total del paciente.
