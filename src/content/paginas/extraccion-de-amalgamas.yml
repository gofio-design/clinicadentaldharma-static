      ## Medicación
  texto_6:
    texto: |
      La medicación una vez extraída la amalgama dependerá de cada caso clínico pero siempre recomendada por un doctor. Entre los tratamientos de medicina naturópata pueden precisarse la homeopatía, fitoterapia u oligoelementos.
