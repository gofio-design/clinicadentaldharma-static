      ## **Conócenos**
  texto_18:
    texto: |
      Somos un centro de odontología holística donde llevamos más de 25 años tratando la boca y sus dolencias con una visión diferente. Esta visión integral adopta un enfoque holístico que reconoce la interconexión entre todos los aspectos del ser humano: físico, emocional, mental y espiritual. Se enfoca en promover la salud y el bienestar en su totalidad, no solo tratando los síntomas físicos, sino también abordando las causas subyacentes y fomentando un estado de equilibrio y armonía en todas las áreas de la vida.
