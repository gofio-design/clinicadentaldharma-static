      **Bievenid@ a Dharma**
  texto_4:
    texto: |
      ***El enfoque Holístico de la Odontología***
  texto_5:
    texto: |
      **¿Qué significa eso?** Significa que miramos a la persona en su totalidad, no sólo a tus dientes. Esto nos permite brindar atención individualizada y concentrarnos en solucionar el problema dental de forma permanente. Comenzamos con una evalución integral de la salud de cada paciente.

      Nuestro objetivo es optimizar la salud a través de los sercicios odontológicos, prevenir tratamientos innecesarios y relacionar la salud de todo el ser con la boca..
  texto_6:
    texto: |
      **Cada tratamiento es un diálogo con tu cuerpo. Escuchamos lo que necesitas, sin excesos ni sobretratamientos.**
    alineacion: centro
