      ## Odontopediatría
  texto_2:
    texto: |
      En Clínica Dental Dharma, contamos con un equipo de odontopediatras altamente especializados que se dedican a facilitar la adaptación de los más pequeños a la consulta dental.

      Utilizamos técnicas innovadoras que permiten que los niños y niñas se familiaricen de manera gradual con el entorno dental. Cada niño es único, por lo que el número de visitas necesarias para lograr esta adaptación puede variar.

      Algunos pequeños pueden comenzar su tratamiento desde la primera cita, iniciando con procedimientos sencillos, siempre que no haya una urgencia que requiera atención inmediata. Además, promovemos la educación sobre el cuidado bucal desde una edad temprana, integrando actividades lúdicas que hacen que aprender sea divertido y efectivo.

      Nuestro compromiso es que cada niño se sienta seguro y cómodo en cada visita, construyendo una relación de confianza que perdure a lo largo de su crecimiento dental. En Clínica Dental Dharma, cada sonrisa es valiosa y estamos aquí para cuidarlas con cariño y profesionalidad.
  texto_3:
    texto: |
      ## Tener un enfoque a nivel preventivo desde la primera infancia es fundamental para desarrollar buenas bases para la salud de los más pequeños
  texto_4:
    texto: |
      Damos prioridad a la prevención, enseñando al niño a familiarizarse con las técnicas de higiene bucodental, para que desde temprana edad tengan el hábito que va a garantizarle una buena salud bucal a lo largo de su vida.

      Todo siempre mediante el juego y en un lenguaje con el que los niños nos puedan entender.

      En algunos casos, se pueden utilizar flores de bach para tratar la ansiedad. Lo imprescindible es crear un ambiente tranquilo y confiado al niño. Es importante que el acompañante (familiar) tenga en cuenta esto ya que es fácil, que sin querer, se transmitan los miedos propios al niño.
