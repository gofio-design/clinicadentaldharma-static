  texto_5:
    texto: |
      #### **Solo utilizamos materiales biocompatibles libres de tóxicos**

      Para [Dharma](https://g.co/kgs/kGcxvSS) es una prioridad que los materiales que aplicamos no tengan tóxicos y sean totalmente biocompatibles. Además apoyamos la capacidad de regeneración del cuerpo con diferentes métodos como por ejemplo la kinesiología, la terapia neural, la fitoterapia, las esencias florales, la biodescodificación y el tratamiento holístico de los materiales dentales. La homeopatía y múltiples especialidades de las terapias holísticas son aplicados en nuestros tratamientos dentales
