      ## **Odontología Holística**
  texto_2:
    texto: |
      Trabajamos sobre tu salud bucal sin dejar a un lado los aspectos de tu salud general, los aspectos psicológicos y los de tu entorno.

      En Clínica [Dental Dharma](/), trabajamos en odontología holística desde hace más de 25 años tratando la boca y sus dolencias con una visión diferente. En esta visión más profunda y holística, se entiende que la boca no es simplemente una parte del cuerpo humano, sino que está intrínsecamente conectada con la esencia misma de la persona. La boca no se considera como un ente separado del individuo, sino como una manifestación integral de su ser.

      Desde esta perspectiva, la salud bucal no se limita a la ausencia de enfermedades dentales o de las encías, sino que se comprende como un reflejo de la salud física, emocional y espiritual de la persona en su totalidad. La boca sirve como un portal no solo para la alimentación y el habla, sino también para la expresión emocional y la conexión con el mundo exterior.
  texto_3:
    texto: |
      Odontología Holística: Se reconoce que las emociones, el estrés y las experiencias personales pueden tener un impacto directo en la salud oral, manifestándose a través de síntomas como el bruxismo, las úlceras bucales o la enfermedad de las encías. Del mismo modo, las condiciones orales pueden influir en el bienestar emocional y la autoestima de la persona.

      En esta visión, el cuidado bucal va más allá de la higiene dental y los tratamientos odontológicos. Se enfatiza la importancia de cultivar una relación consciente y amorosa con la propia boca, reconociéndola como un aspecto sagrado de la experiencia humana. Esto puede implicar prácticas de autocuidado que integren el cuidado físico, emocional y espiritual, como la meditación, la atención plena y el arte de la expresión oral y escrita.

      En resumen, en esta visión la boca se considera como una parte esencial e inseparable del ser humano en su totalidad, y el cuidado bucal se aborda desde una perspectiva holística que reconoce la interconexión entre la salud oral, física, emocional y espiritual.
  texto_4:
    texto: |
      Trabajamos de una manera más integral, menos invasiva apoyándonos de todos los avances actuales en la odontología, así como de las terapias alternativas aplicadas en todos nuestros tratamientos.

      La odontología holística se enfoca en sanar las dolencias dentales analizando el cuerpo como una unidad: mente, emoción, espíritu y entorno; y tratando a cada paciente de manera individualizada.

      Buscamos la rehabilitación de nuestra cavidad bucal de una manera holística, basándonos en la premisa de que los problemas dentales suelen tener origen emocional y psicológico, tratando de identificar y abordar estas causas subyacentes para promover la curación holística y así  asegurarnos de que el tratamiento dental no esté relacionado con otras dolencias en otras partes del cuerpo y/o se cronifique yendo a buscar la “raíz” de la enfermedad.
